name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # The adapter must run on its compatibility floor and on every LTS above it. release=11 only
  # proves compilation; these jobs prove execution, which is the half that actually breaks.
  #
  # The JDK 11 leg builds reladynamo-core only, and that is the whole honest claim. The DynamoDB
  # modules cannot be built by a JDK 11 compiler at all: reladynamo-test-kit's *main* code imports
  # ServerRunner and DynamoDBProxyServer, and DynamoDBLocal 2.5.3 ships those as class-file 61
  # (Java 17). javac on 11 rejects the jar outright — "class file has wrong version 61.0, should be
  # 55.0" — so reladynamo-test-kit, reladynamo-ddb and anything downstream of them need JDK 17+.
  # reladynamo-core depends on neither, so `-pl reladynamo-core -am` (parent + core) is exactly the
  # set that a real JDK 11 VM can compile and execute.
  #
  # What each leg proves:
  #   JDK 11  reladynamo-core executes on a real Temurin 11 VM — XML parsing, mapping, key strategy,
  #           temporal encoding, the query planner and its adversarial fuzzer.
  #   JDK 17  every module compiles and every test passes on the DynamoDB floor (DynamoDB Local's own
  #           bytecode level), DynamoDB Local included.
  #   JDK 21  the same on the current LTS.
  # The release=11 half of the claim — every emitted adapter class is class-file major <= 55, for
  # *all* modules, not just core — is the `java11-floor` gate inside scripts/check.sh below.
  # See docs/JAVA11-VERIFICATION.md.
  adapter:
    name: adapter (JDK ${{ matrix.jdk }}, ${{ matrix.scope }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - jdk: '11'
            scope: 'reladynamo-core'
            args: '-pl reladynamo-core -am'
          - jdk: '17'
            scope: 'all modules'
            args: ''
          - jdk: '21'
            scope: 'all modules'
            args: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - name: Build and test
        run: mvn -B clean test ${{ matrix.args }}

  # The full gate, including the H2-vs-DynamoDB differential suite. Run once rather than per-JDK:
  # it is slow, and what it verifies is store equivalence, not JVM compatibility.
  gate:
    name: closed-loop gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate scripts from their .txt sources
        run: java scripts/GenerateScripts.java
      - name: Run scripts/check.sh
        run: bash scripts/check.sh --iteration ci
      - name: Publish gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-report
          path: reports/check-latest.json

  # Each demo is a standalone project outside the reactor, so the root build does not cover them.
  # They are the proof that the adapter works on models it did not ship with.
  #
  # The JDK here is the *build* JDK, not the demo's language level: 01 and 03 still set
  # maven.compiler.release=11, so their sources stay on the adapter's floor. They are built on 17
  # because every demo test goes through DynamoDB Local, which is Java 17 bytecode, and because
  # installing the adapter first needs a compiler that can read it. 17 rather than 21 keeps these
  # legs on the lowest JDK that can run DynamoDB Local at all.
  demos:
    name: demo ${{ matrix.demo.dir }} (JDK ${{ matrix.demo.jdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo:
          - { dir: '01-crm-bitemporal',      jdk: '17' }
          - { dir: '02-petstore-unitemporal', jdk: '21' }
          - { dir: '03-car-classifier',       jdk: '17' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.demo.jdk }}
          cache: maven
      - name: Install the adapter
        run: mvn -B -q clean install -DskipTests
      - name: Test the demo
        run: mvn -B clean test
        working-directory: demos/${{ matrix.demo.dir }}/project

  # Every shell block in README.md, run verbatim so the docs cannot rot. Selection is by explicit
  # marker, never by pattern: the line directly above an opening ```bash fence must be one of
  #   <!-- ci:run -->              run from the repository root
  #   <!-- ci:run-in-tempdir -->   run from an empty temporary directory
  #   <!-- ci:skip: <reason> -->   deliberately not run; the reason is mandatory
  # The job fails on a shell fence with no marker (a new command must not silently go unrun), on a
  # marker not directly followed by a fence, on an unterminated fence, and on ZERO runnable blocks:
  # a job that runs nothing and passes is worse than no job.
  #
  # The Quickstart's `git clone ... && cd reladynamo` is ci:run-in-tempdir. Inside this checkout it
  # would nest a second copy, and building in that copy would test the default branch instead of the
  # commit under test. Run in an empty directory it still proves the published clone URL works; the
  # blocks after it run in this checkout, which is exactly what that clone would have produced.
  #
  # Blocks run in document order (later ones need earlier ones: the demo resolves the adapter that
  # `mvn clean install` put in ~/.m2), each in a fresh `bash -eo pipefail`. -e is the one departure
  # from pasting into a terminal: without it a failure mid-block would be masked by a later success.
  # JDK 21 because `bash scripts/check.sh` builds the JDK 21 pet-store demo.
  readme:
    name: README commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Extract marked shell blocks from README.md
        shell: bash
        run: |
          out="$RUNNER_TEMP/readme-blocks"
          rm -rf "$out" && mkdir -p "$out"
          awk -v out="$out" '
            function fail(line, msg) { printf "::error file=README.md,line=%d::%s\n", line, msg; bad = 1 }
            function marker(s) { return s ~ /^<!-- ci:/ }
            fence {
              if ($0 ~ /^```[ \t]*$/) { fence = 0; if (file != "") { close(file); file = "" } }
              else if (file != "") print > file
              prev = $0; next
            }
            /^```/ {
              fence = 1; opened = NR
              shell = ($0 ~ /^```(bash|sh|shell)[ \t]*$/)
              if (prev ~ /^<!-- ci:run(-in-tempdir)? -->[ \t]*$/) {
                if (!shell) fail(NR, "ci:run marker on a non-shell fence")
                else {
                  n++
                  file = sprintf("%s/%02d.%s.line%d.sh", out, n, ((prev ~ /tempdir/) ? "tempdir" : "root"), NR)
                }
              } else if (prev ~ /^<!-- ci:skip: [^ ].* -->[ \t]*$/) {
                if (!shell) fail(NR, "ci:skip marker on a non-shell fence")
                else printf "skipped README.md:%d  %s\n", NR, prev
              } else if (marker(prev)) {
                fail(NR - 1, "unrecognised marker: " prev)
              } else if (shell) {
                fail(NR, "shell block without a ci:run, ci:run-in-tempdir or ci:skip marker on the line directly above")
              }
              prev = $0; next
            }
            {
              if (marker(prev)) fail(NR - 1, "marker is not directly followed by a code fence")
              prev = $0
            }
            END {
              if (fence) fail(opened, "code fence is never closed")
              if (marker(prev)) fail(NR, "marker at end of file")
              if (n == 0) fail(1, "zero runnable blocks extracted; refusing to pass a job that runs nothing")
              exit bad
            }
          ' README.md
          for f in "$out"/*.sh; do
            printf '\n--- %s\n' "$(basename "$f")"
            cat "$f"
          done
      - name: Run each block verbatim
        shell: bash
        run: |
          for f in "$RUNNER_TEMP"/readme-blocks/*.sh; do
            name="$(basename "$f" .sh)"
            case "$name" in
              *.tempdir.*) dir="$(mktemp -d)" ;;
              *)           dir="$GITHUB_WORKSPACE" ;;
            esac
            echo "::group::$name (in $dir)"
            cat "$f"
            if (cd "$dir" && bash -eo pipefail "$f"); then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=README.md::block $name failed; the blocks after it were not run"
              exit 1
            fi
          done

  # DynamoDB Local ships no linux-aarch64 sqlite4java native, so the DynamoDB modules cannot run on
  # ARM. ubuntu-latest is x86-64, which is exactly why this belongs in CI rather than on a dev box.
  # See docs/JAVA11-VERIFICATION.md.
